name: refresh-host-tick

# Rewrite /usr/local/bin/adi-watch-tick on lemma-web to use host_commit_push.sh.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  refresh:
    runs-on: [self-hosted, lemma-web]
    steps:
      - uses: actions/checkout@v4
      - name: Install tick + hard-reset /opt/adi-watch to origin/main
        run: |
          set -euo pipefail
          WATCH_DIR=/opt/adi-watch
          TICK=/usr/local/bin/adi-watch-tick
          if [ ! -d "$WATCH_DIR/.git" ]; then
            echo "::error::$WATCH_DIR missing"
            exit 1
          fi
          # Install tick body from repo (single source of truth with setup script).
          sudo cp scripts/adi_watch_tick.sh "$TICK"
          sudo chmod 755 "$TICK"
          sudo chown root:root "$TICK"
          cd "$WATCH_DIR"
          # Preserve local watch state; only update tracked tree to origin/main tip.
          sudo git fetch origin main
          sudo git checkout main
          sudo git reset --hard origin/main
          test -x "$WATCH_DIR/scripts/host_commit_push.sh"
          test -x "$TICK"
          echo "==> installed tick:"
          head -20 "$TICK"
          echo "refresh-host-tick done"
