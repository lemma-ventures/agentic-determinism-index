name: watch

# Continuous provider probes need API keys. This public repo MUST NOT store
# provider secrets (OPENROUTER_API_KEY, NVIDIA_API_KEY, etc.).
#
# Run the watch locally or on a private runner that injects keys from its own
# environment (never from this repository's Actions secrets):
#
#   export OPENROUTER_API_KEY=...   # shell / private runner only
#   ./scripts/ci_watch.sh
#   # then PR the resulting runs/watch + website/ artifacts if desired
#
# Manual dispatch is kept for dry documentation / no-op status checks only.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Provider keys are not available on this public repo"
        type: string
        default: "run scripts/ci_watch.sh on a private host with env keys"

permissions:
  contents: read

jobs:
  refuse-repo-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Do not probe from this public repository
        run: |
          set -euo pipefail
          echo "::notice::ADI continuous watch is intentionally disabled on lemma-ventures/agentic-determinism-index."
          echo "Provider API keys must never be stored as GitHub Actions secrets on this public repo."
          echo "Run ./scripts/ci_watch.sh on a private machine or private runner with keys in the process environment only."
          echo "Publish results via PR of runs/ + website/ artifacts."
          exit 0
