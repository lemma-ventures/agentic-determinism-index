name: pages

# Publish docs/ (generated leaderboard) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never kill one that is already running: a push and
# a manual dispatch of the same commit both land in this group, and cancelling the
# in-progress run marks the commit with a red "cancelled" check even though the
# other run deployed it fine. Queue instead. (This is GitHub's own Pages pattern.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site (leaderboard + run pages + assets)
        run: |
          set -eu
          mkdir -p _site
          if [ -d website ] && [ -f website/index.html ]; then
            rsync -a --delete website/ _site/
          elif [ -d docs ] && [ -f docs/index.html ]; then
            rsync -a --delete docs/ _site/
          else
            echo "::error::no website/ or docs/ index.html"
            exit 1
          fi
          # Keep docs/ mirror for legacy path readers
          mkdir -p docs
          rsync -a --delete _site/ docs/
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
