name: pages

# Publish docs/ (generated leaderboard) to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site (leaderboard + run pages + assets)
        run: |
          set -eu
          mkdir -p _site
          if [ -d website ] && [ -f website/index.html ]; then
            rsync -a --delete website/ _site/
          elif [ -d docs ] && [ -f docs/index.html ]; then
            rsync -a --delete docs/ _site/
          else
            echo "::error::no website/ or docs/ index.html"
            exit 1
          fi
          # Keep docs/ mirror for legacy path readers
          mkdir -p docs
          rsync -a --delete _site/ docs/
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
