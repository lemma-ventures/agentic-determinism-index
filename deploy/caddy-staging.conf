# Staging ADI index — basic-auth (same hash secret as staging.lemma.ventures).
# Installed by website repo workflow deploy-adi-index.yml
index.staging.lemma.ventures {
	encode gzip
	basic_auth {
		lemma {$BASIC_AUTH_HASH}
	}
	root * /opt/agentic-determinism-index
	file_server
	header {
		X-Content-Type-Options "nosniff"
		Referrer-Policy "no-referrer"
	}
}
